<style>
/* Layout: barra lateral de navegación + área de trabajo; en teléfono la barra pasa arriba. Colores de faena: grafito y naranja de seguridad. */
:root{
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#111827; --muted:#4B5563; --line:#E2E5EA;
  --nav:#141C27; --nav-ink:#DDE3EA; --nav-sub:#8F9BAA;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FFF1E8; --accent-text:#9A3412;
  --ok:#067647; --ok-soft:#ECFDF3; --warn:#93370D; --warn-soft:#FFFAEB; --bad:#B42318; --bad-soft:#FEF3F2;
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --panel:#161D27; --ink:#E8ECF1; --muted:#A3ADBA; --line:#283241;
  --nav:#0A0F15; --nav-ink:#DDE3EA; --nav-sub:#8391A2;
  --accent:#F97316; --accent-ink:#1A0E05; --accent-soft:#2A1A10; --accent-text:#FDBA74;
  --ok:#6CE9A6; --ok-soft:#0F2A1D; --warn:#FEC84B; --warn-soft:#2B2210; --bad:#FDA29B; --bad-soft:#2D1513; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --panel:#161D27; --ink:#E8ECF1; --muted:#A3ADBA; --line:#283241;
  --nav:#0A0F15; --nav-ink:#DDE3EA; --nav-sub:#8391A2;
  --accent:#F97316; --accent-ink:#1A0E05; --accent-soft:#2A1A10; --accent-text:#FDBA74;
  --ok:#6CE9A6; --ok-soft:#0F2A1D; --warn:#FEC84B; --warn-soft:#2B2210; --bad:#FDA29B; --bad-soft:#2D1513; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100%}
nav.side{flex:1 1 230px;max-width:100%;background:var(--nav);color:var(--nav-ink);padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:12px;align-items:center}
.brand .mk{width:38px;height:38px;border-radius:9px;background:#F97316;display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;color:#fff;display:block}
.brand small{color:var(--nav-sub);font-size:12px}
.navlist{display:flex;flex-direction:column;gap:4px}
.navlist button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;display:flex;flex-direction:column}
.navlist button span{font-weight:600}
.navlist button small{font-size:12px;opacity:.7}
.navlist button[aria-current="page"]{background:#243142;color:#fff}
.navlist button:hover{background:#1C2735}
.side .foot{margin-top:auto;font-size:12px;color:var(--nav-sub);line-height:1.5}
.side .foot button{all:unset;cursor:pointer;color:#FDBA74;font-weight:600}
main{flex:999 1 560px;min-width:0;padding-block:28px;padding-left:clamp(16px,3vw,40px);padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-size:30px;letter-spacing:-.4px;margin:2px 0 0;text-wrap:balance}
h2{font-size:17px;margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-text)}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
input.in,textarea.in,select.in{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);font-weight:400;min-width:0;width:100%}
textarea.in{resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
label.f{white-space:nowrap}label.f>*{white-space:normal}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-text)}
.chip.g{background:var(--ok-soft);color:var(--ok)}.chip.w{background:var(--warn-soft);color:var(--warn)}.chip.b{background:var(--bad-soft);color:var(--bad)}.chip.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.steps li.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task .hd{display:flex;gap:10px;align-items:flex-start}
.task .num{font-weight:700;color:var(--muted);min-width:28px;padding-top:9px;font-variant-numeric:tabular-nums}
.task .hd input{flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
.note.w{background:var(--warn-soft);color:var(--warn)}.note.b{background:var(--bad-soft);color:var(--bad)}.note.g{background:var(--ok-soft);color:var(--ok)}
.note ul{margin:4px 0 0;padding-left:18px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
table.t th{background:var(--nav);color:#fff;text-align:left;padding:7px 8px;font-weight:600;position:sticky;top:0}
table.t td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t td.c{text-align:center;font-variant-numeric:tabular-nums}
.lv{font-weight:700;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.lv.TOLERABLE,.lv.BAJO,.lv.SRE{background:var(--ok-soft);color:var(--ok)}
.lv.MODERADO,.lv.MEDIO,.lv.NIVEL2,.lv.NIVEL1{background:var(--warn-soft);color:var(--warn)}
.lv.IMPORTANTE,.lv.ALTO,.lv.NIVEL3{background:var(--accent-soft);color:var(--accent-text)}
.lv.INTOLERABLE,.lv.NIVEL4,.lv.CRE{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.busy{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.empresas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.emp{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-height:150px}
.emp.on{border:2px solid var(--accent)}
.emp.off{cursor:default;opacity:.7;border-style:dashed}
.emp b{font-family:var(--f-display);font-size:20px}
.kitrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.kitrow:first-child{border-top:0}
.doc h3{font-size:13px;margin:14px 0 4px;text-transform:uppercase}
.doc p,.doc li{font-size:13px;line-height:1.55}
.doc .ero{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.qs{display:flex;flex-direction:column;gap:10px}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
</style>

<div class="app">
  <nav class="side" aria-label="Menú">
    <div class="brand">
      <div class="mk" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141C27" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>

<script>
(function(){
'use strict';
const D = window.KITDATA;
const $main = document.getElementById('main');
const S = { view: 'panel', empresa: 'berliam', contrato: null, kits: [], cur: null, step: 1, tab: 'miper', busy: null, err: null };
let db = null, sample = null, downloads = null, ctl = null;
let APR = [];

/* ---------- utilidades de DOM (todo texto entra como textContent) ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 10);
const NIVEL = v => ({1:'TOLERABLE',2:'TOLERABLE',4:'MODERADO',8:'IMPORTANTE',16:'INTOLERABLE'})[v] || '';
const num = x => { const n = Number(x); return [1,2,4].includes(n) ? n : null; };
const lvClass = s => 'lv ' + String(s||'').replace(/\s+/g,'');
const CODES = D.catalogo.map(c => c.cod);
const RF_NOMBRES = {}; const rfNombres = () => { for (const k in RF_NOMBRES) delete RF_NOMBRES[k]; for (const [c,r] of Object.entries(D.rfcat)) RF_NOMBRES[c] = r.nombre; }; rfNombres();
const rfAmbito = (r, f) => f === 'todos' ? true : f === 'declarados' ? !!r.declarado : (r.ambito||[]).includes(f);

/* ---------- capacidades ---------- */
(async () => {
  if (!window.claude) return;
  [db, sample, downloads] = await Promise.all(['db','sample','downloads'].map(n => window.claude.use(n).catch(() => null)));
  if (db) db.collection('catalogo_rf').onSnapshot(snap => { for (const d of snap.docs){ const v = d.data(); if (v && v.codigo && Array.isArray(v.preventivos)) D.rfcat[v.codigo] = { ...v, titulo: v.nombre, editado: v.editado || 'db' }; } rfNombres(); if (S.view === 'biblioteca') render(); }, () => {});
  if (db) db.collection('config').onSnapshot(snap => { const d = snap.docs.find(x => x.id === 'contrato'); S.contrato = d ? d.data() : null; if (S.view === 'contrato') render(); }, () => {});
  if (db) db.collection('aprendizajes').onSnapshot(snap => { APR = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.creado||'').localeCompare(a.creado||'')); if (S.view === 'aprendizaje') render(); }, () => {});
  if (db) db.collection('kits').onSnapshot(snap => { S.kits = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.actualizado||'').localeCompare(a.actualizado||'')); if (S.view === 'panel') render(); }, () => {});
  render();
})();

async function guardar(){
  if (!db || !S.cur) return;
  S.cur.actualizado = new Date().toISOString();
  try {
    // La MIPER y el procedimiento pueden pasar el máximo de 256 KB por documento: se guardan aparte, en trozos.
    const o = JSON.parse(JSON.stringify(S.cur)); o._partes = {};
    for (const parte of ['miper','proc','mapaB64']){
      if (!o[parte]) continue;
      const txt = JSON.stringify(o[parte]); const n = Math.ceil(txt.length / 80000);
      for (let i = 0; i < n; i++) await db.doc('kitpartes/' + o.id + '__' + parte + '__' + i).set({ kit: o.id, parte, i, n, s: txt.slice(i*80000, (i+1)*80000) });
      o._partes[parte] = n;
      if (parte === 'mapaB64') o.mapaB64 = null; else if (parte === 'miper'){ o._mcodigos = [...new Set(o.miper.map(f => f.codigo))]; o.miper = { _aparte: true }; } else o.proc = { _aparte: true, bloqueo: o.proc.bloqueo || [] };
    }
    await db.doc('kits/' + o.id).set(o);
  } catch (e) { S.err = 'No se pudo guardar el kit (' + (e.code || 'error') + '). Sigue disponible mientras no cierres la página.'; render(); }
}

/* ---------- navegación ---------- */
function go(v){ S.view = v; S.err = null; render(); window.scrollTo(0,0); }
function renderNav(){
  const nav = document.getElementById('nav'); nav.textContent = '';
  document.getElementById('empLabel').textContent = S.empresa ? 'BERLIAM · Codelco DRT' : 'Elige una empresa';
  const foot = document.getElementById('navFoot'); foot.textContent = '';
  if (!S.empresa) return;
  const items = [['panel','Panel','Kits del contrato'],['nueva','Actividad nueva','Crear kit desde cero'],['biblioteca','Biblioteca','Riesgos de fatalidad y controles'],['contrato','Datos del contrato','Teléfonos y firmantes'],['aprendizaje','Aprendizaje','Reglas que la app aplica']];
  for (const [v,l,s] of items) nav.append(h('button', { 'aria-current': (S.view === v || (v==='nueva' && S.view==='kit')) ? 'page' : null, onclick: () => { if (v==='nueva') nuevaActividad(); else go(v); } }, h('span',{text:l}), h('small',{text:s})));
}
function render(){
  renderNav(); $main.textContent = '';
  const v = S.view;
  if (v === 'inicio') return vInicio();
  if (v === 'panel') return vPanel();
  if (v === 'kit') return vKit();
  if (v === 'biblioteca') return vBiblio();
  if (v === 'contrato') return vContrato();
  if (v === 'aprendizaje') return vAprendizaje();
  if (v === 'mapa') return vMapa();
}
function banner(){
  const out = [];
  if (S.err) out.push(h('div',{class:'note b', role:'alert', text:S.err}));
  if (S.aviso){ out.push(h('div',{class:'note g', role:'status', text:S.aviso})); S.aviso = null; }
  if (!sample) out.push(h('div',{class:'note w', text:'El servicio de análisis no está disponible ahora. Recarga la página; si sigue, avisa al administrador.'}));
  return out;
}

/* ---------- inicio: elegir empresa ---------- */
function vInicio(){
  $main.append(
    h('div',{}, h('div',{class:'eyebrow',text:'Kits SSO'}), h('h1',{text:'¿Con qué empresa trabajas hoy?'}), h('p',{class:'sub',text:'Cada empresa entra a su propio espacio, con su marca, sus formatos y su forma de medir el riesgo.'})),
    h('div',{class:'empresas'},
      h('button',{class:'emp on', onclick:()=>{S.empresa='berliam'; go('panel');}}, h('span',{class:'chip',text:'Activa'}), h('b',{text:'BERLIAM'}), h('span',{class:'sub',text:'Codelco DRT · Mantenimiento Chancado Primario y Correas · Contrato 4600031257'}), h('span',{class:'muted',style:'font-size:12px',text:'SIGO-F-006 v7 · SIGO-F-011 · SIGO-G-012 · kit guía MH-0001'})),
      h('div',{class:'emp off'}, h('span',{class:'chip n',text:'Próximamente'}), h('b',{text:'Nuevo cliente'}), h('span',{class:'sub',text:'Se configura su marca, formatos, matriz P×C, riesgos de fatalidad y kit guía antes de entregarle la app.'}))
    ));
}

/* ---------- panel ---------- */
function vPanel(){
  $main.append(h('div',{class:'row between'},
    h('div',{}, h('div',{class:'eyebrow',text:'Mantenimiento · Chancado Primario y Correas · Contrato 4600031257'}), h('h1',{text:'Kits del contrato'})),
    h('div',{class:'row'}, h('label',{class:'btn',for:'fmapa',style:'display:inline-flex;align-items:center;cursor:pointer'},'Cargar mapa de procesos (.xlsx)'), h('input',{type:'file',id:'fmapa',accept:'.xlsx',style:'position:absolute;width:1px;height:1px;opacity:0',onchange:e=>cargarMapa(e.target.files[0])}), h('button',{class:'btn pri', onclick:nuevaActividad, text:'Crear kit nuevo'}))), ...banner());
  const flujo = h('div',{class:'card'}, h('h2',{text:'Cómo se crea un kit'}),
    h('ol',{class:'steps'}, ...['Describir la actividad','Listado con energías y RF','Visto bueno','MIPER y procedimiento','Descargar y firmar'].map((t,i)=>h('li',{text:(i+1)+'. '+t}))),
    h('p',{class:'sub',text:'La app arma el borrador con el criterio de la prevencionista del área. Un prevencionista lo revisa y lo firma antes de usarlo en terreno.'}));
  const lista = h('div',{class:'card'}, h('h2',{text:'Kits guardados'}));
  if (!db) lista.append(h('p',{class:'sub',text:'Los kits se guardan cuando abres la app desde claude.ai.'}));
  else if (!S.kits.length) lista.append(h('p',{class:'sub',text:'Todavía no hay kits. Crea el primero con "Crear kit nuevo": describe la actividad y la app arma el listado de tareas.'}));
  else for (const k of S.kits){
    const ft = datosTerreno(k).filter(x => !x.valor).length;
    const est = k.proc && ft ? ['Faltan ' + ft + ' datos de terreno','w'] : k.proc ? ['Kit completo','g'] : k.miper ? ['MIPER lista','w'] : k.aprobado ? ['Listado aprobado','w'] : k.listado ? ['Listado por revisar','n'] : ['Borrador','n'];
    lista.append(h('div',{class:'kitrow'},
      h('div',{style:'min-width:0'}, h('b',{text:k.titulo || 'Actividad sin título'}), h('div',{class:'sub',text:(k.codigo||'Sin código') + ' · ' + ((k.listado&&k.listado.tareas)||[]).length + ' tareas · ' + new Date(k.actualizado||Date.now()).toLocaleDateString('es-CL')})),
      h('div',{class:'row'}, h('span',{class:'chip '+est[1],text:est[0]}), h('button',{class:'btn sm',onclick:()=>abrir(k),text:'Abrir'}))));
  }
  $main.append(flujo, lista);
}
async function cargarPartes(k){
  if (!db || !k._partes) return k;
  for (const [parte, n] of Object.entries(k._partes)){
    let txt = ''; for (let i = 0; i < n; i++){ const d = await db.doc('kitpartes/' + k.id + '__' + parte + '__' + i).get(); txt += (d.exists && d.data().s) || ''; }
    try { k[parte] = JSON.parse(txt); } catch { k[parte] = null; }
  }
  delete k._partes; delete k._mcodigos; return k;
}
async function abrir(k){ S.cur = await cargarPartes(JSON.parse(JSON.stringify(k))); S.step = (k.proc || k.miper) ? 3 : k.listado ? 2 : 1; S.tab = 'miper'; go('kit'); }
const FECHA = () => new Date().toLocaleDateString('es-CL',{month:'long',year:'numeric'});
function siguienteCodigo(pref){
  const re = new RegExp('^' + pref.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\d+)$'); let max = 0;
  for (const k of S.kits){ const m = re.exec(String(k.codigo||'').trim()); if (m) max = Math.max(max, Number(m[1])); }
  return pref + String(max + 1).padStart(4,'0');
}
function codigoRepetido(k){ return S.kits.find(x => x.id !== k.id && String(x.codigo||'').trim() && String(x.codigo).trim() === String(k.codigo||'').trim()); }
function nuevaActividad(){

const RAZONAMIENTO = `⟦S1⟧`;

function tierDe(etiqueta, tier){

  if (tp === 'quick') return 'quick';
  if (tp === 'proc') return /^Redactando el procedimiento/.test(etiqueta) ? 'quick' : (tier || 'default');
  if (tp === 'mixto') return /^Evaluando peligros/.test(etiqueta) ? (tier || 'default') : 'quick';
  return tier || 'default';
}
async function pedir(prompt, etiqueta, tier){
  if (!sample) throw { code: 'unavailable' };
  ctl = new AbortController();
  S.busy = { t: etiqueta, n: 0 }; render();
  try {
    return await sample.json(prompt, { modelTier: tierDe(etiqueta, tier), signal: ctl.signal, onText: ({ text }) => { if (S.busy){ S.busy.n = text.length; const el = document.getElementById('busyN'); if (el) el.textContent = 'Escribiendo… ' + text.length + ' caracteres'; } } });
  } finally { S.busy = null; ctl = null; }
}
function errTexto(e){
  const c = e && e.code;
  if (c === 'cancelled') return null;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Tu sesión venció. Recarga la página y vuelve a entrar.';
  if (c === 'sin_clave') return 'El administrador aún no configura la clave del servicio de análisis.';
  if (c === 'red') return 'Sin conexión con el servidor. Revisa tu internet e intenta de nuevo.';
  if (/^api_5/.test(c||'') || c === 'error') return 'El servicio de análisis no respondió (' + c + '). Espera un momento y vuelve a intentarlo.';
  if (c === 'rate_limited') return 'Se alcanzó el límite de uso por ahora. Espera unos minutos y vuelve a intentarlo.';
  if (c === 'invalid_json') return 'La respuesta vino incompleta. Vuelve a intentarlo; si se repite, acorta la descripción.';
  if (c === 'prompt_too_large') return 'La actividad tiene demasiadas tareas para un paso. Divide la actividad en dos kits.';
  return 'No se pudo completar el análisis (' + (c || 'error') + '). Vuelve a intentarlo.';
}

  if (!L.tareas.some(t => (t.energias||[]).length)) return analizar();
  if (!nuevas.length){ S.err = 'No hay respuestas nuevas para aplicar.'; render(); return; }
  const hechas = Object.keys(k.respuestas||{}).length; const cupo = Math.max(0, 8 - hechas);
  const prompt = `${RAZONAMIENTO}${aprendido('listado')}

Actividad: ${k.titulo}. Área: ${k.area}.
Listado YA analizado (no lo repitas entero):
${JSON.stringify(L.tareas.map(t => ({ n: t.n, tarea: t.tarea, energias: t.energias, rf: t.rf, control_principal: t.control_principal })))}

Respuestas nuevas del usuario:
${nuevas.length ? nuevas.map(([q,v]) => '- ' + q + ': ' + v).join('\n') : '(ninguna)'}

Riesgos de fatalidad válidos (SIGO-G-012 v002): ${Object.entries(D.rfcat).map(([c,r]) => c + (r.declarado ? '' : '(no declarado)')).join(', ')}.

⟦S4⟧
Devuelve SOLO las tareas cuyo análisis cambia por estas respuestas (mismo n y mismo texto de tarea; no agregues ni quites tareas). Si ninguna cambia, "tareas" va vacío.

"preguntas": ${cupo ? '⟦S5⟧' + Math.min(2,cupo) + '⟦S6⟧' : 'vacío: ya se hicieron todas las preguntas permitidas; lo que no se sepa va en "faltantes"'}. "faltantes": siempre vacío [].`;
  try {
    const r = await pedir(prompt, 'Aplicando tus respuestas solo a las tareas afectadas', 'complex');
    if (!r || !Array.isArray(r.tareas)) throw { code: 'invalid_json' };
    const cambiadas = [];
    for (const a of r.tareas){ const t = L.tareas.find(x => String(x.n) === String(a.n)); if (!t) continue;
      if (Array.isArray(a.energias)) t.energias = a.energias.map(String);
      for (const f of ['linea_fuego','evento','control_principal','y_si_falla']) if (a[f]) t[f] = String(a[f]);
      if (Array.isArray(a.rf)) t.rf = a.rf.map(String).filter(x => /^RF\d\d$/.test(x));
      cambiadas.push(t.n); }
    const respondidas = new Set(Object.keys(k.respuestas||{}).filter(q => (k.respuestas[q]||'').trim()));
    L.preguntas = [...L.preguntas.filter(q => !respondidas.has(q.pregunta)), ...(r.preguntas||[]).slice(0,Math.min(2,cupo)).map(q => ({ pregunta: String(q.pregunta||''), por_que: String(q.por_que||'') }))].filter(q => q.pregunta && !respondidas.has(q.pregunta)).slice(0,6);
    for (const [q,v] of nuevas) usadas[q] = v; k.respuestasUsadas = usadas;
    k.aprobado = false; k.miper = null; k.proc = null;
    S.aviso = cambiadas.length ? 'Se actualizaron las tareas ' + cambiadas.join(', ') + '. Las demás quedaron igual.' : 'Tus respuestas no cambian el análisis de ninguna tarea.';
    await guardar();
  } catch (e) { S.err = errTexto(e); }
  render();
}

function construirMiper(filas){
  const k = S.cur; const out = [];
  for (const t of k.listado.tareas){
    const propias = filas.filter(f => String(f.tarea_n) === String(t.n));
    for (const f of propias) out.push(fila(t, f.codigo, f.peligro, f.P, f.C, f.Pr, f.Cr, f.val_inh, f.val_res, f.medidas, f.jerarquia));
    for (const e of D.entorno){
      const hig = typeof e.inherente[0] !== 'number';
      out.push(fila(t, e.codigo, e.peligro, hig?null:e.inherente[0], hig?null:e.inherente[1], hig?null:e.residual[0], hig?null:e.residual[1], hig?e.inherente[2]+'|'+e.inherente[3]:null, hig?e.residual[2]+'|'+e.residual[3]:null, e.medidas, e.jerarquia, true));
    }
  }
  return out;
}
function fila(t, codigo, peligro, P, C, Pr, Cr, vi, vr, medidas, jer, entorno){
  const cat = (D.catalogo.find(c=>c.cod===codigo)||{}).cat || '';
  const r = { tarea_n: t.n, tarea: t.tarea, cargo: (t.cargos||[]).join(' / '), dotacion: t.dotacion, codigo: String(codigo||''), cat, peligro: String(peligro||''), medidas: String(medidas||''), jerarquia: String(jer||''), resp: 'ADC / SUPERVISION', entorno: !!entorno };
  P=num(P); C=num(C); Pr=num(Pr); Cr=num(Cr);
  if (P && C){ r.P=P; r.C=C; r.vep=P*C; r.niv=NIVEL(P*C); } else { const [a,b]=String(vi||'|').split('|'); r.vep=a||''; r.niv=b||''; }
  if (Pr && Cr){ r.Pr=Pr; r.Cr=Cr; r.vepr=Pr*Cr; r.nivr=NIVEL(Pr*Cr); } else { const [a,b]=String(vr||'|').split('|'); r.vepr=a||''; r.nivr=b||''; }
  return r;
}
function sincronizarRF(k){
  // Coherencia: si la MIPER evalúa un RCxx en una tarea, el listado (y por tanto el procedimiento) debe llevar su RFxx.
  k.rfAgregados = [];
  for (const t of (k.listado && k.listado.tareas) || []){
    t.rf = t.rf || [];
    for (const f of k.miper.filter(f => f.tarea_n === t.n && !f.entorno)){
      const m = String(f.codigo || '').match(/_RC(\d\d)(_|$)/); if (!m) continue;
      const rf = 'RF' + m[1]; if (!D.rfcat[rf] || t.rf.includes(rf)) continue;
      t.rf.push(rf); t.rf.sort(); k.rfAgregados.push(`Tarea ${t.n}: ${rf}`);
    }
  }
}
function alertas(){
  const k = S.cur, A = [];
  if (!k.miper) return A;
  for (const t of k.listado.tareas){
    const fs = k.miper.filter(f=>f.tarea_n===t.n && !f.entorno);
    if (!fs.length) A.push(['b',`Tarea ${t.n}: no tiene peligros propios evaluados.`]);
    for (const rf of t.rf){ const rr = D.rfcat[rf]; if (!rr) A.push(['b',`Tarea ${t.n}: ${rf} no existe en la SIGO-G-012 vigente.`]); else if (!rr.declarado) A.push(['b',`Tarea ${t.n}: ${rf} ${rr.nombre} no está en la declaración de aplicabilidad de BERLIAM. El RESSO v11 descuenta 5% por exponerse a un RF no declarado: decláralo o cambia el método.`]); }
    for (const rf of t.rf){ const rc = 'RC' + rf.slice(2); if (!CODES.some(c=>c.includes(rc))) continue; if (!k.miper.some(f=>f.tarea_n===t.n && (f.codigo.includes('_'+rc+'_') || f.codigo.includes('_'+rc)))) A.push(['w',`Tarea ${t.n}: el listado marca ${rf} pero la MIPER no tiene un peligro ${rc}.`]); }
  }
  for (const x of k.rfAgregados || []) A.push(['w',`${x} se agregó al listado y al procedimiento porque la MIPER evalúa ese riesgo crítico. Revisa que corresponda.`]);
  for (const f of k.miper){
    if (!CODES.includes(f.codigo)) A.push(['b',`Tarea ${f.tarea_n}: el código "${f.codigo}" no está en la lista del formato.`]);
    if (f.P && f.Pr && f.vepr > f.vep) A.push(['b',`Tarea ${f.tarea_n}: el residual de "${f.peligro.slice(0,50)}" es mayor que el inherente.`]);
    if (f.C && f.Cr && f.Cr < f.C && !f.entorno && !/RC01|RC22|\(N\)|A1/.test(f.codigo)) A.push(['w',`Tarea ${f.tarea_n}: "${f.peligro.slice(0,50)}" baja la consecuencia de ${f.C} a ${f.Cr}; revisa que la medida quite la energía.`]);
  }
  return A;
}

  x += H2('5.3 ACTIVIDADES PREVIAS AL MANTENIMIENTO') + para('Antes de ejecutar el trabajo se deben realizar las siguientes tareas:') + B.previas.map(([t,d])=>para(t,{b:true,before:60,after:20})+para(d,{jc:'both'})).join('');
  x += H2('5.4 PASO A PASO DE LA ACTIVIDAD') + tbl([10600],[['DESCRIPCIÓN DE LA TAREA'],...p.pasos.map(s=>[{xml:para(s.n+'  '+s.t,{size:8.5,ind:500,hang:500,after:20})}])],{head:'black'});

  }
  x += para('GESTIÓN DE RESIDUOS',{b:true,before:120}) + tbl([5300,5300],[['RIESGO','MEDIDA DE CONTROL'],[{xml:B.residuos[0].map((t,i)=>bullet(t,{sym:(i+1)+'.',size:8.5,ind:300})).join(''),top:1},{xml:B.residuos[1].map((t,i)=>bullet(t,{sym:(i+1)+'.',size:8.5,ind:300})).join(''),top:1}]],{head:'black'});
  x += H2('5.5 ACTIVIDADES POST MANTENIMIENTO') + B.post.map(([t,d])=>para(t,{b:true,before:60,after:20})+para(d,{jc:'both'})).join('');

  x += H1('6. RIESGOS DE FATALIDAD') + p.rf.map(c=>bullet(B.rf_desc[c]||(c+' '+(RF_NOMBRES[c]||'')+': [completar descripción]'))).join('');

  x += H1('9. REFERENCIAS LEGALES, NORMATIVAS Y OTRAS ASOCIADAS AL PROCEDIMIENTO') + B.legales.map(t=>bullet(t)).join('');
  x += H1('10. ANEXOS') + H2('10.1 E.C.F APLICABLES') + (p.ecf.length?p.ecf:['[completar]']).map(t=>bullet(t)).join('');
  x += H2('10.2 RIESGOS DE FATALIDAD APLICABLES') + para(B.rf_contrato_texto) + imgP('rf_aplicables', 16);
  x += H2('10.3 E.S.T APLICABLES') + imgP('est_aplicables', 15);
  x += H2('10.4 IMPACTO AL MEDIOAMBIENTE') + B.impacto_texto.map(t=>para(t)).join('') + tbl([600,3300,2900,3800],[['N°','DESCRIPCIÓN DEL ASPECTO AMBIENTAL','EFECTOS POSIBLES (IMPACTO AMBIENTAL)','CONTROLES OPERACIONALES'],...(p.aspectos||B.aspectos).map((a,i)=>[String(i+1),...a])],{head:'gray'});
  x += H2('10.5 PROTECCIÓN AL MEDIOAMBIENTE') + tbl([3500,7100],[['CONTENEDOR','TIPO DE RESIDUO'],...(window.CONTENEDORES||[]).map(([im,txt,items])=>[{xml:`<w:p><w:pPr><w:jc w:val="center"/></w:pPr>${img(im.split('.')[0], 0, 2.4)}</w:p>`},{xml:(txt?para(txt):'')+items.map(t=>bullet(t)).join('')}])],{head:'gray'});
  x += H2('10.6 TELÉFONOS DE EMERGENCIA') + para('Cualquier persona que detecte la emergencia deberá comunicarlo inmediatamente por teléfono a:') + tbl([3600,3600,3400],[['CARGO','NOMBRE','NÚMERO DE CONTACTO'],...contratoBase().telefonos.map(t=>[{t:t[0]||'',b:true},t[1]||'[completar]',t[2]||'[completar]'])],{head:'gray'}) + imgP('tipos_emergencia', 16);
  x += H2('10.7 PROTOCOLOS DE COMUNICACIONES DE EMERGENCIA') + imgP('protocolo_drt', 12) + salto + imgP('protocolo_berliam', 14);
  x += para('11. EVALUACIÓN DE PROCEDIMIENTO',{style:'Heading1',b:true,pb:true,after:80}) + tbl([5300,5300],[[{t:'EVALUACIÓN DE PROCEDIMIENTO DE TRABAJO',span:2,b:true,fill:'D9D9D9'}],[{t:'FECHA DE EVALUACIÓN:',b:true},{t:'NOTA EVALUACIÓN:',b:true}],[{t:'NOMBRE Y FIRMA TRABAJADOR:',b:true},{t:'NOMBRE Y FIRMA SUPERVISOR:',b:true}],...p.evaluacion.map((q,i)=>[{xml:para((i+1)+'.- '+q)+para('')+para(''),span:2}]),[{xml:para('Observaciones:')+para('')+para(''),span:2}]]);
  x += para('12. REGISTRO DE DIFUSIÓN',{style:'Heading1',b:true,pb:true,after:80}) + tbl([600,4200,1800,2200,1800],[['N°','NOMBRE','RUT','FIRMA','FECHA'],...Array.from({length:25},(_,i)=>[String(i+1),'','','',''])],{head:'gray'});
  x += tbl([5300,5300],[[{t:'ASPECTOS RELEVANTES DE LA CAPACITACIÓN',span:2,b:true}],[{xml:para('')+para(''),span:2}],[{t:'NOMBRE DEL RELATOR:',b:true},{t:'FIRMA RELATOR:',b:true}]]);

  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const sect = `<w:sectPr><w:headerReference w:type="default" r:id="rIdH"/><w:footerReference w:type="default" r:id="rIdF"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="680" w:right="850" w:bottom="850" w:left="850" w:header="340" w:footer="340" w:gutter="0"/></w:sectPr>`;
  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W}><w:body>${x}${sect}</w:body></w:document>`;
  const cx = 1650000, cy = Math.round(cx*96/433);
  const logo = `<w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="1" name="logo"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="1" name="logo.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdL"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
  const hdr = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${W}><w:tbl><w:tblPr><w:tblW w:w="10540" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="3000"/><w:gridCol w:w="7540"/></w:tblGrid><w:tr><w:tc><w:tcPr><w:tcW w:w="3000" w:type="dxa"/></w:tcPr><w:p>${logo}</w:p></w:tc><w:tc><w:tcPr><w:tcW w:w="7540" w:type="dxa"/></w:tcPr>${para(p.titulo,{size:10,jc:'right',after:0})}${para(p.codigo,{size:9,jc:'right',color:'595959'})}</w:tc></w:tr></w:tbl><w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="18" w:space="1" w:color="808080"/></w:pBdr></w:pPr></w:p></w:hdr>`;
  const fld = c => `<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> ${c} </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`;
  const ftr = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${W}><w:p><w:pPr><w:jc w:val="center"/></w:pPr>${run('Página ',{size:10})}${fld('PAGE')}${run(' de ',{size:10})}${fld('NUMPAGES')}</w:p></w:ftr>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma" w:eastAsia="Tahoma" w:cs="Tahoma"/><w:sz w:val="18"/><w:lang w:val="es-CL"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/></w:rPr></w:style></w:styles>`;
  const settings = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:updateFields w:val="true"/></w:settings>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const drels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdT" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdH" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdF" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${IMGS.map(([n,I])=>`<Relationship Id="rIdI_${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${n}.${I.ext}"/>`).join('')}</Relationships>`;
  const hrels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdL" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.jpg"/></Relationships>`;
  const logoBytes = Uint8Array.from(atob(D.logo), c=>c.charCodeAt(0));
  const blob = zip([['[Content_Types].xml',ct],['_rels/.rels',rels],['word/document.xml',docXml],['word/_rels/document.xml.rels',drels],['word/styles.xml',styles],['word/settings.xml',settings],['word/header1.xml',hdr],['word/footer1.xml',ftr],['word/_rels/header1.xml.rels',hrels],['word/media/logo.jpg',logoBytes], ...IMGS.map(([n,I])=>['word/media/'+n+'.'+I.ext, Uint8Array.from(atob(I.b64), c=>c.charCodeAt(0))])]);
  guardarArchivo(nombreBase()+'_procedimiento.docx', blob);
}
